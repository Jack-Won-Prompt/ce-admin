name: Deploy CE Admin

on:
  push:
    branches:
      - main

  # 손으로도 돌린다 (2026-10-09). 테스트서버가 멈춰 운영 배포가 막힐 때
  # skip_test 로 앞 단계를 건너뛴다 — 그때만 쓴다.
  workflow_dispatch:
    inputs:
      skip_test:
        description: '테스트서버 단계를 건너뛰고 운영에 바로 배포한다'
        type: boolean
        default: false

# 배포는 한 번에 하나만 (2026-10-10 지시).
#
# 두 커밋이 비슷한 때에 올라가면 Action 이 동시에 두 번 돌아, 같은 서버에서
# git pull 과 마이그레이션이 겹친다. 앞 배포를 끊지 않고 차례로 돌린다.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # ── 1단계: 테스트서버에 먼저 올리고 점검한다 (2026-10-09 지시) ──────────
  #
  # 여태 main 에 올라가면 곧바로 운영에 배포했다. 자동 고침이 붙은 뒤로는 사람 손을
  # 거치지 않은 코드가 그 길로 바로 운영에 섰다 — 사이에 문을 하나 둔다.
  #
  # 테스트서버(www.ceadmin.co.kr)가 Agent 가 사는 곳이기도 해서, 이 단계가 돌면
  # Agent 가 읽는 소스도 늘 운영과 같은 판으로 맞춰진다.
  test-deploy:
    name: 테스트서버 배포와 점검
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.skip_test != true }}

    steps:
      - name: Deploy to test server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USERNAME }}
          key: ${{ secrets.TEST_SSH_KEY }}
          script: |
            set -e

            cd ~/www/lcpoint

            echo "===== GIT PULL ====="
            # 사람이 그 자리에서 고쳐 둔 것이 있으면 멈춘다 — 덮지 않는다
            git fetch --quiet origin main
            git merge --ff-only origin/main

            echo "===== MIGRATE ====="
            # artisan 은 www-data 로, HOME 을 줘야 돈다 (tinker·psysh 가 쓸 자리)
            sudo -u www-data env HOME=/tmp php artisan migrate --force

            echo "===== LARAVEL CACHE ====="
            sudo -u www-data env HOME=/tmp php artisan optimize

            echo "===== AGENT WORKER RESTART ====="
            # 일꾼이 묵은 코드를 담고 있으면 고친 자리가 아무 효과가 없다
            sudo systemctl restart agent-queue
            sleep 2
            systemctl is-active agent-queue

            echo "===== BOOT CHECK ====="
            # 라우트를 모두 세워 본다 — 치명적 오류가 있으면 여기서 죽는다
            sudo -u www-data env HOME=/tmp php artisan route:list > /dev/null

            echo "===== HTTP CHECK ====="
            # 실제로 응답하는지 본다. 500 이면 -f 가 0 이 아닌 값을 돌려 배포가 멈춘다
            curl -fsS -o /dev/null -m 20 https://www.ceadmin.co.kr/login

            echo "===== TEST STAGE OK ====="

      # 점검이 멈추면 자동 고침을 되물린다 (2026-10-10 지시).
      #
      # 멈춘 커밋은 운영에 가지 않지만 main 에는 남는다 — 다음 사람이 올린 것이
      # 점검을 지나면 **묻어서 함께 운영으로 올라간다.** 그 구멍을 막는다.
      # 사람이 올린 커밋은 건드리지 않는다(명령 안에서 적은 이를 보고 가린다).
      - name: 되물리기 (자동 고침일 때만)
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USERNAME }}
          key: ${{ secrets.TEST_SSH_KEY }}
          script: |
            cd ~/www/lcpoint
            sudo -u www-data env HOME=/tmp php artisan agent:revert ${{ github.sha }}               --reason="배포 점검에서 멈췄습니다 (GitHub Actions 실행 ${{ github.run_id }})"

  # ── 2단계: 앞 단계가 통과했을 때만 운영에 배포한다 ───────────────────
  deploy:
    name: 운영 배포
    runs-on: ubuntu-latest
    needs: test-deploy
    # 앞 단계를 건너뛰라고 했을 때만 그것 없이도 돈다
    if: ${{ always() && (needs.test-deploy.result == 'success' || inputs.skip_test == true) }}

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /opt/ce-admin

            echo "===== GIT PULL ====="
            git pull origin main

            # 표를 먼저 맞춘다 (2026-09-29 지시).
            #
            # 여태 이 절차는 코드만 옮기고 마이그레이션은 사람이 따로 돌렸다. 그래서
            # 칸을 새로 쓰는 판이 올라가면 **코드는 갔는데 표가 안 간 사이**가 생겼다 —
            # 첨부 서류 유형 바꾸기가 운영에서 500 으로 죽은 것이 그 까닭이다
            # (doc_type_by·image_type_by 가 없는데 거기에 쓰려 했다).
            #
            # 캐시를 비우기 전에 돌린다. 마이그레이션이 죽으면 set -e 가 여기서 배포를
            # 멈추므로, 표가 어긋난 채 새 코드가 서는 일은 없다.
            echo "===== MIGRATE ====="
            sudo -u www-data php artisan migrate --force

            # 설정·경로·화면 캐시만 비운다 (2026-09-30).
            #
            # 여태 `optimize:clear` 를 썼는데 그 안에는 `cache:clear` 가 들어 있다 —
            # **응용 캐시를 통째로 지운다.** NICE 본인확인은 표준창을 오가는 동안
            # 복호화 열쇠를 캐시에 들고 있는데, 그 사이에 배포가 돌면 열쇠가 사라져
            # 돌아온 사람이 「본인확인 세션이 만료되었습니다」를 만난다. 실제로
            # 2026-09-30 16:04 에 그 일이 있었다.
            #
            # 배포가 비워야 하는 것은 코드를 따라 바뀌는 것들뿐이다.
            echo "===== LARAVEL CACHE CLEAR ====="
            sudo -u www-data php artisan config:clear
            sudo -u www-data php artisan route:clear
            sudo -u www-data php artisan view:clear
            sudo -u www-data php artisan event:clear

            echo "===== STORAGE PERMISSION ====="
            sudo chown -R www-data:www-data storage bootstrap/cache

            # 올린 파일을 웹에서 열 수 있게 잇는다 (2026-09-30 실전 시험에서 드러남).
            #
            # 팩스 합본 PDF 는 storage/app/public 에 저장하고 /storage/... 주소로
            # 내려받는다. 그 연결이 운영에 없어서 「PDF 다운로드 (전송 서류 통합본)」이
            # 404 였다 — 공단에 무엇이 나갔는지 확인할 길이 없었다.
            #
            # artisan storage:link 를 쓰지 않는다. www-data 로 돌면 public 에 쓸
            # 권한이 없어 symlink() 가 죽고, set -e 때문에 배포가 그 자리에서 멈춘다.
            # root 로 돌리면 이번엔 로그·캐시 파일이 root 것으로 생겨 뒤가 막힌다.
            echo "===== STORAGE LINK ====="
            if [ -L public/storage ]; then
              echo "public/storage 이미 있음 -> $(readlink public/storage)"
            elif [ -e public/storage ]; then
              echo "!! public/storage 가 링크가 아니다 — 사람이 확인해야 한다" >&2
            else
              sudo ln -sfn /opt/ce-admin/storage/app/public public/storage
              sudo chown -h www-data:www-data public/storage
              echo "public/storage 를 새로 만들었다"
            fi

            echo "===== PHP-FPM RESTART ====="
            sudo systemctl reload php8.3-fpm

            echo "===== DEPLOY COMPLETE ====="